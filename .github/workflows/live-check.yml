name: live-check
on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时巡检（错峰整点,避免CDN整点抖动）
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 线上SW哈希 vs 仓库SW哈希
        run: |
          set -e
          LOCAL=$(rg -o 'zhiming_v2_[0-9a-f]+' sw.js | head -1)
          echo "仓库版本锚: $LOCAL"
          REMOTE=$(curl -s --max-time 20 -H 'Cache-Control: no-cache' 'https://199932.github.io/zhimingv2/sw.js?v=livecheck' | rg -o 'zhiming_v2_[0-9a-f]+' | head -1)
          echo "线上版本锚: $REMOTE"
          if [ -z "$REMOTE" ]; then
            echo "::warning::线上 sw.js 拉取失败——CDN抖动或Pages断链,人工确认一次"
            exit 1
          fi
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::error::线上落后于仓库! 本地=$LOCAL 线上=$REMOTE —— 检查 Pages 部署队列(坑86)或CDN交错(坑88),空commit kick可解"
            exit 1
          fi
          echo "线上与仓库同步 ✓ ($REMOTE)"
      - name: 三处一致（仓库 = 线上 index = 线上 sw——坑88交错盲区）
        run: |
          set -e
          REPO=$(ls assets/app.*.js | sed -E 's#assets/app\.([0-9a-f]{8})\.js#\1#')
          IDX=$(curl -s --max-time 20 -H 'Cache-Control: no-cache' 'https://199932.github.io/zhimingv2/index.html?v=lc2' | grep -oE 'app\.[0-9a-f]{8}\.js' | head -1 | sed -E 's/app\.([0-9a-f]{8})\.js/\1/')
          SW=$(curl -s --max-time 20 -H 'Cache-Control: no-cache' 'https://199932.github.io/zhimingv2/sw.js?v=lc3' | grep -oE 'zhiming_v2_[0-9a-f]{8}' | head -1 | sed -E 's/zhiming_v2_//')
          echo "仓库app=$REPO | 线上index引用=$IDX | 线上sw锚=$SW"
          if [ -z "$IDX" ]; then echo "::error::线上index拉取失败——CDN抖动"; exit 1; fi
          [ "$REPO" = "$IDX" ] || { echo "::error::坑88交错:线上index引用的app($IDX)≠仓库app($REPO)"; exit 1; }
          [ "$REPO" = "$SW" ] || { echo "::error::坑86/88:线上sw锚($SW)≠仓库app($REPO)"; exit 1; }
          echo "三处一致 ✓ ($REPO)"
      - name: 触发器自检（坑147:CI静默与全绿长得一样——warning不error防时序假红）
        run: |
          LAST=$(curl -s --max-time 20 -H "Authorization: token $GITHUB_TOKEN" \
            'https://api.github.com/repos/199932/zhimingv2/actions/runs?per_page=1' \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['workflow_runs'][0]['created_at'])")
          HOURS=$(( ( $(date +%s) - $(date -d "$LAST" +%s) ) / 3600 ))
          echo "最近一次 Actions 运行距现在 ${HOURS}h 前 ($LAST)"
          if [ "$HOURS" -gt 30 ]; then
            echo "::warning::坑147:最近一次CI运行已是 ${HOURS}h 前——push触发器可能坏了(branches过滤错类),人工确认一次"
          fi
