name: build-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖（terser 由 lockfile 钉版本）
        run: npm ci

      - name: 安装测试浏览器（内核断言走真实渲染链）
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps
      - name: 内核断言（物理不变量）
        run: python3 tests/core.test.py

      - name: 构建（terser失败/体积超预算=红,裸包拒绝上线）
        run: node build.js

      - name: 产物可复现（重构建零diff;sitemap.xml的lastmod写当天必异日,排除）
        run: |
          git diff --exit-code -- . ':(exclude)sitemap.xml' ':(exclude)docs/' ':(exclude)*.md'
          echo "产物与源码同步 ✓"

      - name: 体积预算报告
        run: |
          APP=$(ls assets/app.*.js | head -1)
          GZ=$(gzip -c "$APP" | wc -c)
          IDGZ=$(gzip -c index.html | wc -c)
          echo "📊 首屏: app+index gzip = $(( (GZ + IDGZ) / 1024 ))KB"
          echo "📊 mods: $(for m in assets/mod-*.js; do printf '%s %sKB ' "$(basename $m)" "$(($(gzip -c $m | wc -c)/1024))"; done)"

      - name: 账本新鲜度（非阻断提醒）
        run: |
          last=$(git log -1 --format=%ct -- docs/pitfalls.md)
          n=$(git log --since=@$last --oneline | grep -cE '^[0-9a-f]+ (fix|FATAL)' || true)
          echo "自账本上次更新以来 fix 提交数: $n"
          if [ "$n" -gt 10 ]; then
            echo "::warning::坑账本已落后 $n 个 fix 提交,去补条目"
          fi
