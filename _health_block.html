      if(g===5){
        html+='<div style="border:1px dashed var(--card-border);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 4px;">'
          +'<div style="font-size:15px;font-weight:800;color:var(--pri);">'+(r.dun==='YANG'?'阳':'阴')+r.juNum+'</div>'
          +'<div style="font-size:9px;color:var(--text-hint);margin-top:2px;">中五宫</div></div>';
        continue;
      }
      var p=GONG_POS[g], door=r.bamen[g]||'', star=(r.tianpanXing&&r.tianpanXing[g])||'', shen=(r.bashen&&r.bashen[g])||'';
      html+='<div onclick="window._fsPick('+g+')" style="cursor:pointer;border:1.5px solid var(--card-border);border-radius:10px;padding:8px 4px;text-align:center;">'
        +'<div style="font-size:11px;font-weight:700;color:var(--text);">'+p.n+'</div>'
        +'<div style="font-size:12px;font-weight:800;color:var(--pri);margin-top:2px;">'+(DOOR_FS[door]?door:'')+'门</div>'
        +'<div style="font-size:9px;color:var(--text-hint);margin-top:1px;">'+(shen?shen.slice(0,2):'—')+' · '+(star?star.replace('天',''):'' )+'</div></div>';
    }
    html+='</div>'
      +'<div style="font-size:11px;color:var(--text-sub);margin-top:10px;">👆 点任一方位：看这块地方有什么问题、现在怎么改</div>';
    if((r.goodGe&&r.goodGe.length)||(r.badGe&&r.badGe.length)){
      html+='<div style="margin-top:8px;font-size:11px;line-height:1.8;">';
      if(r.goodGe&&r.goodGe.length) html+='<div style="color:var(--pri);">✦ 此局吉格：'+r.goodGe.join('、')+'</div>';
      if(r.badGe&&r.badGe.length) html+='<div style="color:#b0713f;margin-top:2px;">△ 此局留意：'+r.badGe.join('、')+'</div>';
      html+='</div>';
    }
    html+='</div></div><div id="fs-detail"></div>';
    el.innerHTML=html;
  };

  window._fsPick = function(g){
    var el=document.getElementById('fs-detail'); if(!el) return;
    var r=_qmNow(); if(!r||!r.bamen) return;
    var p=GONG_POS[g], door=r.bamen[g]||'', star=r.tianpanXing?r.tianpanXing[g]:'', shen=r.bashen?r.bashen[g]:'';
    var df=DOOR_FS[door]||{t:'',a:'保持整洁即可'};
    var sf=STAR_FS[star]||'', hf=SHEN_FS[shen]||'';
    var tg=r.tianpanGan?r.tianpanGan[g]:'', dgp=r.dipan?r.dipan[g]:'';
    var h='<div class="widget" style="grid-column:1/-1;">'
      +'<div class="widget-title">🧭 '+p.n+' · '+p.x+'宫（'+p.el+'）</div>'
      +'<div class="widget-body" style="padding:14px;">'
      +'<div style="font-size:11.5px;color:var(--text-hint);line-height:1.7;">局盘：'+(shen||'—')+' · '+(star||'—')+' · '+door+'门 · 天盘'+(tg||'—')+'／地盘'+(dgp||'—')+'</div>'
      +'<div style="font-size:15px;font-weight:700;color:var(--pri);margin-top:10px;line-height:1.5;">'+door+'门 · '+df.t+'</div>';
    if(sf) h+='<div style="font-size:12.5px;color:var(--text);margin-top:8px;line-height:1.7;">⭐ '+(star||'')+'：'+sf+'</div>';
    if(hf) h+='<div style="font-size:12.5px;color:var(--text);margin-top:6px;line-height:1.7;">✦ '+(shen||'')+'：'+hf+'</div>';
    h+='<div style="margin-top:12px;background:rgba(124,158,99,.09);border-radius:12px;padding:12px;">'
      +'<div style="font-size:12px;font-weight:700;color:var(--pri);">✊ 现在就做（5 分钟内见效）</div>'
      +'<div style="font-size:13px;color:var(--text);line-height:1.8;margin-top:4px;">'+df.a+'</div></div>'
      +'<div style="font-size:10px;color:var(--text-hint);margin-top:8px;">奇门看宅为民俗用法，改的是「当下可用之气」——真正的居住问题请找专业机构</div>'
      +'</div></div>';
    el.innerHTML=h;
    try{ el.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(_){}
  };

  window.renderHealth = function(){
    try{ renderBody(); }catch(_){}
    try{ window._renderHealthFS(); }catch(_){}
  };
})();
</script>
