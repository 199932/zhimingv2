<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>知命V2 · 今日运势</title>
<style>
:root{--bg:#FAF8F5;--card:#fff;--text:#2b2b2b;--text-sub:#666;--pri:#8B6F47;}
@media (prefers-color-scheme: dark){
  :root{--bg:#1A1814;--card:#3A3530;--text:#D4B896;--text-sub:#b3a088;--pri:#a89170;}
}
body{margin:0;padding:8px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:13px;}
.widget{background:var(--card);border-radius:12px;padding:12px;border:1px solid rgba(139,111,71,.15);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.w-date{font-size:11px;color:var(--text-sub);margin-bottom:6px;text-align:center;}
.w-title{font-size:13px;font-weight:700;color:var(--pri);text-align:center;margin-bottom:8px;}
.w-tarot{display:flex;gap:10px;align-items:center;}
.w-tarot-card{width:80px;height:120px;border-radius:6px;background:linear-gradient(135deg,#1A1625,#2D2654);border:1px solid #D4AF37;display:flex;align-items:center;justify-content:center;font-size:32px;color:rgba(212,175,55,.25);flex-shrink:0;}
.w-tarot-info{flex:1;min-width:0;}
.w-tarot-name{font-size:16px;font-weight:700;color:var(--text);}
.w-tarot-ur{font-size:12px;color:var(--text-sub);margin-top:2px;}
.w-tarot-kw{font-size:11px;color:var(--pri);margin-top:4px;}
.w-zodiac{text-align:center;}
.w-zodiac-sym{font-size:36px;line-height:1;}
.w-zodiac-name{font-size:16px;font-weight:700;margin-top:4px;}
.w-zodiac-score{font-size:12px;color:var(--text-sub);margin-top:2px;}
.w-empty{text-align:center;padding:10px;font-size:14px;color:var(--text-sub);}
.w-link{font-size:12px;color:var(--pri);text-decoration:none;margin-top:6px;display:block;text-align:center;}
</style>
</head>
<body>
<div class="widget">
  <div class="w-date" id="wDate"></div>
  <div class="w-title">✦ 知命V2 今日运势</div>
  <div id="wContent"></div>
</div>
<script>
(function(){
  var today = new Date();
  var y = today.getFullYear(), m = today.getMonth()+1, d = today.getDate();
  document.getElementById('wDate').textContent = y + '年' + m + '月' + d + '日';

  // Try get tarot daily
  var tarotKey = 'zhiming_tarot_daily_' + y + '_' + m + '_' + d;
  var tarotData = null;
  try{ tarotData = JSON.parse(localStorage.getItem(tarotKey)||'null'); }catch(_){}

  // Try get zodiac
  var zodiacData = null;
  try{ zodiacData = JSON.parse(localStorage.getItem('_lastZodiacResult')||'null'); }catch(_){}

  var content = document.getElementById('wContent');
  if(tarotData && tarotData.name){
    var ur = tarotData.reversed ? '逆位' : '正位';
    var kw = (tarotData.keywords||[]).slice(0,3).join(' · ');
    content.innerHTML = '<div class="w-tarot">'
      + '<div class="w-tarot-card">✦</div>'
      + '<div class="w-tarot-info"><div class="w-tarot-name">' + tarotData.name + '</div><div class="w-tarot-ur">' + ur + '</div><div class="w-tarot-kw">' + kw + '</div></div>'
      + '</div>';
  }else if(zodiacData && zodiacData.name){
    var sc = zodiacData.overallScore || (zodiacData.scores&&zodiacData.scores[0]) || 75;
    content.innerHTML = '<div class="w-zodiac">'
      + '<div class="w-zodiac-sym">' + zodiacData.symbol + '</div>'
      + '<div class="w-zodiac-name">' + zodiacData.name + '</div>'
      + '<div class="w-zodiac-score">今日运势 ' + sc + ' 分</div>'
      + '</div>';
  }else{
    content.innerHTML = '<div class="w-empty">暂无今日运势数据</div><a class="w-link" href="./index.html">打开知命V2查看今日运势</a>';
  }
})();
</script>
</body>
</html>
